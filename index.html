<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Vanshika 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fdeff2, #f9c5d1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 50px 40px;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      max-width: 380px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #e63956;
      margin-bottom: 15px;
      font-size: 30px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .pandas {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .buttons {
      position: relative;
      height: 150px;
    }

    button {
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
      font-weight: 500;
    }

    #yes {
      background: #e63956;
      color: white;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 12px 25px rgba(230,57,86,0.35);
    }

    #yes:hover {
      transform: translateX(-50%) scale(1.06);
    }

    #no {
      background: #eee;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      cursor: not-allowed;
    }

    .message {
      display: none;
      font-size: 22px;
      color: #e63956;
      margin-top: 25px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall 3s linear infinite;
      opacity: 0.85;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="pandas">🐼🐼</div>

    <h1>Vanshika</h1>
    <p>I made this just for you 🌸</p>

    <h1>Will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No 🙈</button>
    </div>

    <div class="message" id="message">
      You just made this donkey very happy 🐼💖
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");

    const noTexts = [
      "No 🙈",
      "Nice try 😌",
      "Not allowed 😳",
      "Still no? 👀",
      "This button is fake 😭",
      "Give up 😂",
      "Okay okay 😤",
      "YES 💖"
    ];

    let count = 0;

    // Hover fun (but click disabled)
    noBtn.addEventListener("mouseover", () => {
      count++;

      const x = Math.random() * 240 - 120;
      const y = Math.random() * 120 - 60;

      noBtn.style.transform =
        `translate(${x}px, ${y}px) scale(${Math.max(0.6, 1 - count * 0.05)})`;

      noBtn.innerText = noTexts[Math.min(count, noTexts.length - 1)];

      if (count >= 7) {
        noBtn.style.background = "#e63956";
        noBtn.style.color = "white";
      }
    });

    // Completely disable click
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
      launchConfetti();
    });

    function launchConfetti() {
      for (let i = 0; i < 120; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background =
          ["#e63956", "#f1a7b8", "#fdeff2", "#f9c5d1"]
          [Math.floor(Math.random() * 4)];

        confetti.style.animationDuration =
          (Math.random() * 2 + 2) + "s";

        confetti.style.width =
        confetti.style.height =
          Math.random() * 8 + 6 + "px";

        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }
    }
  </script>

</body>
</html>
