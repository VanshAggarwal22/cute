<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 340px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 140px;
    }

    button {
      padding: 14px 26px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: absolute;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
    }

    #no {
      background: #ddd;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
    }

    .message {
      display: none;
      font-size: 22px;
      color: #ff4d6d;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 😢</button>
    </div>

    <div class="message" id="message">
      YAYYYY!! 💕<br>
      I knew you’d say yes 🥰
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");

    const noTexts = [
      "No 😢",
      "Wait… what?",
      "Are you sure? 😳",
      "This feels illegal 😭",
      "Please don’t 😔",
      "Okay stop trying 😂",
      "I’m getting scared",
      "Fine. I give up 😭💔"
    ];

    let count = 0;

    noBtn.addEventListener("mouseover", () => {
      count++;

      const x = Math.random() * 220 - 110;
      const y = Math.random() * 100 - 50;
      noBtn.style.transform = `translate(${x}px, ${y}px) scale(${1 - count * 0.05})`;

      noBtn.innerText = noTexts[Math.min(count, noTexts.length - 1)];

      if (count > 6) {
        noBtn.innerText = "I choose YES 💖";
        noBtn.style.background = "#ff4d6d";
        noBtn.style.color = "white";
      }
    });

    noBtn.addEventListener("click", () => {
      yesBtn.click();
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
